<title>Quotation Portal Mockup</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* layout: top bar always; GAC gets an icon rail that expands; customer has no sidebar */
:root{--bg:#f4f6f8;--card:#ffffff;--fg:#14202b;--mut:#5b6b7a;--line:#dde3e9;--accent:#0b6e8f;--accent-fg:#ffffff;--top:#0c2a3f;--top-fg:#ffffff;--good:#1b7f4b;--goodbg:#e2f4ea;--warn:#8a5a00;--warnbg:#fff1d6;--bad:#a42b2b;--badbg:#fbe4e4;--info:#1f5fa8;--infobg:#e1edfb;--grey:#4a5866;--greybg:#e9edf1;--ui:"IBM Plex Sans",system-ui,sans-serif;--mono:"IBM Plex Mono",ui-monospace,monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e161d;--card:#16222c;--fg:#e8eef3;--mut:#9fb0be;--line:#2a3945;--accent:#4cb6d8;--accent-fg:#06222d;--top:#08151f;--good:#5fd391;--goodbg:#143426;--warn:#f0c060;--warnbg:#3a2d10;--bad:#f08a8a;--badbg:#3c1a1a;--info:#8bbcf2;--infobg:#172b44;--grey:#b3c0cb;--greybg:#243340;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e161d;--card:#16222c;--fg:#e8eef3;--mut:#9fb0be;--line:#2a3945;--accent:#4cb6d8;--accent-fg:#06222d;--top:#08151f;--good:#5fd391;--goodbg:#143426;--warn:#f0c060;--warnbg:#3a2d10;--bad:#f08a8a;--badbg:#3c1a1a;--info:#8bbcf2;--infobg:#172b44;--grey:#b3c0cb;--greybg:#243340;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:16px/1.5 var(--ui);padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
button,input,select,textarea{font:inherit;color:inherit}
.top{background:var(--top);color:var(--top-fg);display:flex;align-items:center;gap:16px;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
.brand{font-weight:600;letter-spacing:.02em;display:flex;align-items:center;gap:10px}
.brand i{width:26px;height:26px;border-radius:6px;background:var(--accent);display:inline-block}
.search{flex:1;max-width:520px;margin:0 auto}
.search input{width:100%;padding:8px 12px;border-radius:6px;border:0;background:#ffffff22;color:#fff}
.search input::placeholder{color:#ffffffaa}
.sw{position:relative;margin-left:auto}
.avatar{display:flex;align-items:center;gap:10px;background:#ffffff18;border:0;color:#fff;border-radius:999px;padding:4px 12px 4px 4px;cursor:pointer}
.avatar b{width:30px;height:30px;border-radius:50%;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;font-size:13px}
.menu{position:absolute;right:0;top:46px;background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:8px;min-width:260px;box-shadow:0 8px 24px #0003;padding:6px}
.menu button{display:block;width:100%;text-align:left;background:none;border:0;padding:10px 12px;border-radius:6px;cursor:pointer}
.menu button:hover{background:var(--greybg)}
.menu small{display:block;color:var(--mut)}
.menu .on{outline:2px solid var(--accent)}
.shell{display:flex;min-height:calc(100vh - 54px)}
.rail{width:60px;background:var(--card);border-right:1px solid var(--line);padding:10px 8px;display:flex;flex-direction:column;gap:4px;transition:width .15s;flex:none}
.rail.open{width:210px}
.rail button{display:flex;align-items:center;gap:12px;border:0;background:none;padding:10px;border-radius:8px;cursor:pointer;text-align:left;white-space:nowrap;overflow:hidden}
.rail button .ic{width:22px;text-align:center;font-family:var(--mono);font-size:13px;color:var(--mut);flex:none}
.rail button .lb{display:none}
.rail.open button .lb{display:inline}
.rail button.act{background:var(--infobg);color:var(--info)}
.rail button.act .ic{color:var(--info)}
.rail .gap{flex:1}
main{flex:1;min-width:0;padding:24px max(16px,env(safe-area-inset-right,0px)) 48px max(16px,env(safe-area-inset-left,0px))}
.wrap{max-width:1100px;margin:0 auto}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:20px}
.tabs button{background:none;border:0;padding:10px 16px;cursor:pointer;color:var(--mut);border-bottom:3px solid transparent;font-weight:500}
.tabs button.act{color:var(--accent);border-color:var(--accent)}
h1{font-size:26px;margin:0 0 4px;text-wrap:balance}
h2{font-size:18px;margin:0 0 12px}
.sub{color:var(--mut);margin:0 0 20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:20px;margin-bottom:16px}
.grid3{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.mode{background:var(--card);border:2px solid var(--line);border-radius:10px;padding:18px;text-align:left;cursor:pointer}
.mode:hover{border-color:var(--accent)}
.mode.sel{border-color:var(--accent);background:var(--infobg)}
.mode b{display:block;font-size:18px}
.mode span{color:var(--mut);font-size:14px}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
label{display:block;font-size:13px;color:var(--mut);margin-bottom:4px;font-weight:500}
input,select,textarea{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:6px;background:var(--card)}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
input.bad,select.bad{border-color:var(--bad);background:var(--badbg)}
.btn{background:var(--accent);color:var(--accent-fg);border:0;border-radius:6px;padding:10px 18px;cursor:pointer;font-weight:600}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:none;color:var(--accent);border:1px solid var(--accent)}
.btn.red{background:var(--bad);color:#fff}
.btn.sm{padding:6px 12px;font-size:14px}
.chip{display:inline-block;padding:2px 10px;border-radius:999px;font-size:13px;font-weight:500;white-space:nowrap}
.c-good{background:var(--goodbg);color:var(--good)}.c-warn{background:var(--warnbg);color:var(--warn)}.c-bad{background:var(--badbg);color:var(--bad)}.c-info{background:var(--infobg);color:var(--info)}.c-grey{background:var(--greybg);color:var(--grey)}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:15px}
th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tr.clk{cursor:pointer}tr.clk:hover td{background:var(--greybg)}
.mono{font-family:var(--mono);font-size:14px}
.small{font-size:13px;color:var(--mut)}
.pills{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.pills button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 14px;cursor:pointer}
.pills button.act{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:16px}
.sum div{border:1px solid var(--line);border-radius:8px;padding:12px}
.sum b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
.banner{border-radius:8px;padding:14px 16px;margin-bottom:16px;background:var(--infobg);color:var(--fg);border:1px solid var(--info)}
.sug{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:8px}
.sug.warn{border-color:var(--warn);background:var(--warnbg)}
.modalbg{position:fixed;inset:0;background:#0008;display:grid;place-items:center;z-index:50;padding:16px}
.modal{background:var(--card);border-radius:12px;padding:24px;width:min(640px,100%);max-height:90vh;overflow:auto}
.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.split{display:grid;grid-template-columns:2fr 1fr;gap:16px}
@media(max-width:800px){.split{grid-template-columns:1fr}.search{display:none}.menu{right:-8px}}
.mail{border:1px solid var(--line);border-radius:8px;padding:14px;background:var(--bg);white-space:pre-wrap;font-size:14px}
.tl{margin:0;padding-left:18px;color:var(--mut);font-size:14px}
.note{color:var(--mut);font-size:13px;margin-top:6px}
.tag{font-family:var(--mono);font-size:12px;background:var(--greybg);color:var(--grey);padding:2px 6px;border-radius:4px}
.footer{margin-top:28px;color:var(--mut);font-size:13px}
</style>
<div id="app"></div>
<script>
const fmt=n=>n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const MODES=[['Air','Fast, by airline'],['Sea','FCL or LCL by ocean'],['Land','Trucking by road'],['Courier','Small parcels, door to door'],['Hand Carry','Urgent, carried by person'],['Others','Anything else']];
const INC={FCA:'Free Carrier. The seller hands the goods to the carrier named by the buyer.',FOB:'Free On Board. The seller loads the goods on the ship at the port of origin.',DAP:'Delivered At Place. The seller bears all costs and risks until arrival at the destination, excluding discharge.',EXW:'Ex Works. The buyer collects the goods at the seller’s premises.',CIF:'Cost, Insurance and Freight. The seller pays freight and insurance to the destination port.'};
const SAMPLES={
'1. Hero, Demo Principal 07 (Air SHA to DXB)':{from:'logistics@principal07.demo',subj:'Quotation Request: 3 POs from Shanghai to Dubai',body:'Dear GAC Team,\n\nPlease provide a quotation for the following air freight shipment for Demo Principal 07 to Dubai branch:\n\nOrigin: Shanghai (SHA)\nDestination: Dubai (DXB)\nMode: Air\nIncoterm: FCA\nService: Consolidation is fine\nJob Type: Supplier to WH Destination\n\nCargo details:\n- PO-901: 200 kg, 1.4 CBM\n- PO-902: 185 kg, 1.3 CBM\n- PO-903: 200 kg, 1.5 CBM\nTotal Gross Weight: 585 kg\nTotal Volume: 4.2 CBM\n\nBest regards,\nCoordinator 07',cust:'Demo Principal 07',kg:585,cbm:4.2,inc:'FCA',mode:'Air',lane:'Shanghai to Dubai'},
'2. Learning loop A, Demo Principal 12':{from:'procurement@principal12.demo',subj:'Urgent Air Freight: Shanghai to Dubai',body:'Hi GAC Quotations,\n\nKindly quote air shipment from Shanghai to Dubai for Demo Principal 12:\n- Mode: Air\n- Incoterm: FCA\n- 1 PO (PO-8812): Gross Weight 450 kg, Volume 2.8 CBM\n- Service: Consolidation\n\nThanks,\nCoordinator 12',cust:'Demo Principal 12',kg:450,cbm:2.8,inc:'FCA',mode:'Air',lane:'Shanghai to Dubai'},
'3. New customer, Sea':{from:'shipping@newclientlogistics.com',subj:'Rate enquiry for ocean freight Shanghai to Dubai',body:'Hello,\n\nWe are New Client Logistics and would like to request an ocean freight quote:\n- Origin: Shanghai (SHA)\n- Destination: Dubai (JEA)\n- Mode: Sea\n- Incoterm: FOB\n- PO-SEA-101: 1200 kg, 8.5 CBM\n- PO-SEA-102: 1500 kg, 10.0 CBM\n\nBest regards,\nRobert Vance',cust:'New Client Logistics',kg:2700,cbm:18.5,inc:'FOB',mode:'Sea',lane:'Shanghai to Jebel Ali'},
'5. Incomplete request (no incoterm or weights)':{from:'alex@randomtrading.demo',subj:'Air freight quote needed',body:'Hello GAC,\n\nWe need an air freight quotation from Shanghai to Dubai for some electronic goods.\nCan you please quote your best rate?\n\nRegards,\nAlex',cust:'Random Trading',missing:['Incoterm','Total weight','Total volume'],mode:'Air',lane:'Shanghai to Dubai'}};
function mkLines(){return[['Origin Charges','per kg',0.12,0.08],['Airfreight','per kg',3.10,2.60],['Fuel Surcharge','per kg',0.45,0.35],['Security Surcharge','per kg',0.10,0.07],['Export Customs','per shipment',85,60],['Import Customs','per shipment',120,90],['Transportation','per shipment',150,110]].map(a=>({s:a[0],unit:a[1],price:a[2],cost:a[3],src:'Template'}))}
function mkNotes(){return[{id:1,svc:'Transportation',price:175,basis:'per shipment',reason:'Customer agreed new rate',from:'QT-seed-2',st:'open'},{id:2,svc:'Airfreight',price:10,basis:'per kg',reason:'Customer agreed new rate',from:'QT-seed-4',st:'open'}]}
const clone=o=>JSON.parse(JSON.stringify(o));
let seq=3;
const S={user:'customer',cv:'new',gv:'requests',menu:false,rail:false,mode:null,f:{},done:null,open:null,draft:null,filter:'All',apTab:'Waiting',modal:null,ver:null,sample:Object.keys(SAMPLES)[0],mail:null,toast:'',why:null,
reqs:[
{id:'REQ-0003',src:'Email',cust:'Demo Principal 07',mode:'Air',lane:'Shanghai to Dubai',st:'Draft ready',kg:700,cbm:4.2,inc:'FCA',lines:mkLines(),notes:mkNotes(),versions:[],tl:['Received 08:42','Read by AI 08:42','Draft created 08:43'],date:'6 Nov'},
{id:'REQ-0002',src:'Email',cust:'Random Trading',mode:'Air',lane:'Shanghai to Dubai',st:'Missing information',missing:['Incoterm','Total weight','Total volume'],kg:0,cbm:0,lines:[],notes:[],versions:[],tl:['Received 08:10','Read by AI 08:10'],date:'6 Nov'},
{id:'REQ-0001',src:'Portal',cust:'Blue Dune Energy',mode:'Sea',lane:'Jebel Ali to Singapore',st:'Sent to customer',kg:2400,cbm:12,inc:'FOB',lines:mkLines().slice(0,4).map((l,i)=>({...l,s:['Ocean Freight','Origin Terminal Handling','Destination Port Clearance','On-carriage'][i],unit:i==0?'per shipment':'per shipment',price:[1800,240,310,190][i],cost:[1500,180,240,140][i]})),notes:[],versions:[],tl:['Received 2 Nov','Draft created','Submitted','Accepted','Sent to customer 3 Nov'],date:'2 Nov'}]};
S.reqs[2].versions=[{v:1,lines:clone(S.reqs[2].lines)}];
const get=id=>S.reqs.find(r=>r.id===id);
const kgOf=l=>l.unit==='per kg'?1:0;
const amt=(l,r)=>l.price===null?null:(l.unit==='per kg'?l.price*r.kg:l.price);
const cst=(l,r)=>l.unit==='per kg'?l.cost*r.kg:l.cost;
function tot(lines,r){let rev=0,c=0;lines.forEach(l=>{if(l.price!==null){rev+=amt(l,r);c+=cst(l,r)}});return{rev,c,oi:rev-c,m:rev?(rev-c)/rev*100:0}}
function custStatus(r){return{'Draft ready':'Received','Submitted':'Under review','Accepted':'Under review','Rejected':'Under review','Sent to customer':'Quotation ready','Revision requested':'Revision requested'}[r.st]}
function chipFor(s){const m={'Received':'grey','Under review':'warn','Quotation ready':'good','Revision requested':'info','Draft ready':'info','Missing information':'warn','Submitted':'warn','Accepted':'good','Rejected':'bad','Sent to customer':'good','Reading email':'grey'};return `<span class="chip c-${m[s]||'grey'}">${s}</span>`}
const wt=(mode,kg,cbm)=>{const v=mode==='Air'?cbm*1000/6:mode==='Courier'?cbm*200:null;return v===null?null:{vol:v,ch:Math.max(kg,v)}};
const REQ={Air:['from','to','inc','qty','kg','cbm','desc','ready'],Courier:['from','to','inc','qty','kg','cbm','desc','ready'],Sea:['from','to','inc','qty','kg','cbm','desc','ready','load'],Land:['from','to','inc','qty','kg','cbm','desc','ready','veh'],'Hand Carry':['from','to','kg','desc','ready'],Others:['desc']};
const NAMES={from:'From',to:'To',inc:'Incoterm',qty:'Total quantity',kg:'Total weight',cbm:'Total volume',desc:'Cargo description',ready:'Ready date',load:'Load type',veh:'Vehicle type'};
const missingF=()=>(REQ[S.mode]||[]).filter(k=>!String(S.f[k]||'').trim());
function H(){const gac=S.user==='gac';return topbar(gac)+`<div class="shell">${gac?rail():''}<main><div class="wrap">${gac?gacView():custView()}</div></main></div>${S.modal?modal():''}${S.toast?`<div style="position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--top);color:#fff;padding:10px 18px;border-radius:8px;z-index:60">${S.toast}</div>`:''}`}
function topbar(g){return `<div class="top"><div class="brand"><i></i>Quotation Portal</div>${g?'<div class="search"><input id="gs" placeholder="Search requests and quotations" aria-label="Search"></div>':''}<div class="sw"><button class="avatar" data-a="menu"><b>${g?'CZ':'BD'}</b><span>${g?'Christine Zock':'Blue Dune Energy'}</span><span aria-hidden="true">▾</span></button>${S.menu?`<div class="menu"><small style="padding:6px 12px">Switch demo user</small><button data-a="user" data-v="customer" class="${!g?'on':''}">Customer<small>Blue Dune Energy. No sidebar.</small></button><button data-a="user" data-v="gac" class="${g?'on':''}">GAC user<small>Christine Zock. Sidebar, full edit rights.</small></button></div>`:''}</div></div>`}
function rail(){const it=[['requests','Rq','Requests'],['approvals','Ap','Approvals'],['email','Em','Email simulator'],['settings','St','Settings']];return `<nav class="rail ${S.rail?'open':''}" aria-label="Main">${it.map(i=>`<button data-a="gv" data-v="${i[0]}" class="${S.gv===i[0]||(S.gv==='draft'&&i[0]==='requests')?'act':''}" title="${i[2]}"><span class="ic">${i[1]}</span><span class="lb">${i[2]}</span></button>`).join('')}<div class="gap"></div><button data-a="rail"><span class="ic">${S.rail?'«':'»'}</span><span class="lb">Close sidebar</span></button></nav>`}
function custView(){const t=`<div class="tabs"><button data-a="cv" data-v="new" class="${['new','form','done'].includes(S.cv)?'act':''}">Request a quotation</button><button data-a="cv" data-v="mine" class="${['mine','quote'].includes(S.cv)?'act':''}">My requests</button></div>`;
if(S.cv==='new')return t+`<h1>Request a quotation</h1><p class="sub">Choose how your cargo will travel.</p><div class="grid3">${MODES.map(m=>`<button class="mode ${S.mode===m[0]?'sel':''}" data-a="mode" data-v="${m[0]}"><b>${m[0]}</b><span>${m[1]}</span></button>`).join('')}</div><div class="actions"><button class="btn" data-a="cv" data-v="form" ${S.mode?'':'disabled'}>Continue</button></div>`;
if(S.cv==='form')return t+form();
if(S.cv==='done')return t+`<div class="card" style="text-align:center;padding:40px"><div class="chip c-good" style="font-size:15px">Received</div><h1 style="margin-top:12px">We have received your request</h1><p class="mono">${S.done.id}</p><p>${S.done.mode}, ${S.done.lane}, ${S.done.kg} kg, ${S.done.cbm} m3, ${S.done.inc||'no incoterm'}</p><p class="sub">Our team will send you a quotation.</p><button class="btn" data-a="cv" data-v="mine">View my requests</button></div>`;
if(S.cv==='mine')return t+`<h1>My requests</h1><p class="sub">Blue Dune Energy</p><div class="card tw"><table><tr><th>Request</th><th>Mode</th><th>Lane</th><th>Date</th><th>Status</th></tr>${S.reqs.filter(r=>r.cust==='Blue Dune Energy').map(r=>`<tr class="clk" data-a="cq" data-v="${r.id}"><td class="mono">${r.id}</td><td>${r.mode}</td><td>${r.lane}</td><td>${r.date}</td><td>${chipFor(custStatus(r))}</td></tr>`).join('')}</table></div>`;
if(S.cv==='quote')return t+quotePage()}
function form(){const m=S.mode,miss=missingF(),f=S.f,bad=k=>(S.tried&&miss.includes(k))?'bad':'';const w=wt(m,+f.kg||0,+f.cbm||0);
const inp=(k,l,ty='text',ex='')=>`<div><label for="f_${k}">${l}${REQ[m].includes(k)?' *':''}</label><input id="f_${k}" data-f="${k}" type="${ty}" value="${f[k]||''}" class="${bad(k)}" ${ex}></div>`;
return `<h1>${m} quotation</h1><p class="sub">From, by ${m}, to. Fields marked * are required.</p>
<div class="card"><h2>From and to</h2><div class="row">${inp('from','From (place or port)')}${inp('to','To (place or port)')}</div><div class="row" style="margin-top:12px"><label style="display:flex;gap:8px;align-items:center;margin:0"><input type="checkbox" style="width:auto"> Pick-up needed</label><label style="display:flex;gap:8px;align-items:center;margin:0"><input type="checkbox" style="width:auto"> Delivery needed</label></div></div>
<div class="card"><h2>Cargo</h2><div class="row">${inp('qty','Total quantity','number')}${inp('cbm','Total volume (m3)','number','step="0.1"')}${inp('kg','Total weight (kg)','number')}<div><label>Chargeable weight</label><div style="padding:9px 0;font-weight:600" class="mono">${w?fmt(w.ch)+' kg':(+f.kg?fmt(+f.kg)+' kg':'-')}</div></div></div><div class="note">${m==='Air'?'Air: volume weight = volume x 1000 / 6. We charge the greater of actual and volume weight.':m==='Courier'?'Courier: volume weight = volume x 200. We charge the greater of actual and volume weight.':'Weight rule for this mode is not defined yet. Gross weight is shown.'}</div>
<div class="row" style="margin-top:12px">${inp('desc','Cargo description')}${inp('ready','Ready date','date')}</div></div>
<div class="card"><h2>Incoterm and details</h2><div class="row"><div><label for="f_inc">Incoterm${REQ[m].includes('inc')?' *':''}</label><select id="f_inc" data-f="inc" class="${bad('inc')}"><option value="">Choose</option>${Object.keys(INC).map(i=>`<option ${f.inc===i?'selected':''}>${i}</option>`).join('')}</select></div>${m==='Sea'?`<div><label for="f_load">Load type *</label><select id="f_load" data-f="load" class="${bad('load')}"><option value="">Choose</option><option ${f.load==='FCL'?'selected':''}>FCL</option><option ${f.load==='LCL'?'selected':''}>LCL</option></select></div>`:''}${m==='Land'?`<div><label for="f_veh">Vehicle type *</label><select id="f_veh" data-f="veh" class="${bad('veh')}"><option value="">Choose</option><option ${f.veh==='FTL'?'selected':''}>FTL</option><option ${f.veh==='LTL'?'selected':''}>LTL</option></select></div>`:''}</div><div class="note">${f.inc?INC[f.inc]:'Pick an incoterm to see what it means.'}</div></div>
<div class="actions" style="justify-content:space-between"><span><button class="btn ghost" data-a="example">Fill example</button> <button class="btn ghost" data-a="cv" data-v="new">Back</button></span><span>${miss.length?`<span class="small">${miss.length} field${miss.length>1?'s':''} still needed: ${miss.map(k=>NAMES[k]).join(', ')}&nbsp;&nbsp;</span>`:''}<button class="btn" data-a="submitreq" ${miss.length?'disabled':''}>Request quotation</button></span></div>`}
function quotePage(){const r=get(S.open);const vs=r.versions;if(!vs.length)return`<div class="card"><h1>${r.id}</h1><p>${r.mode}, ${r.lane}. Status ${chipFor(custStatus(r))}</p><p class="sub">No quotation has been sent yet.</p><button class="btn ghost" data-a="cv" data-v="mine">Back</button></div>`;const sv=S.ver||vs[vs.length-1].v;const v=vs.find(x=>x.v===sv);const last=sv===vs[vs.length-1].v;const T=tot(v.lines,r);const rr=r.st==='Revision requested';
return `<div class="card"><div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center"><div><h1>${r.id}, ${r.lane}</h1><span class="small">${r.mode}, ${fmt(r.kg)} kg, ${r.inc}</span></div><div>${chipFor(custStatus(r))} <select id="ver" style="width:auto">${vs.map(x=>`<option value="${x.v}" ${x.v===sv?'selected':''}>Version ${x.v}${x.v===vs[vs.length-1].v?' (latest)':''}</option>`).join('')}</select></div></div></div>
<div class="split"><div class="card tw"><h2>Quotation</h2><table><tr><th>Service</th><th>Unit</th><th class="n">Unit price</th><th class="n">Amount (USD)</th></tr>${v.lines.map(l=>`<tr><td>${l.s}</td><td>${l.unit}</td><td class="n">${fmt(l.price)}</td><td class="n">${fmt(amt(l,r))}</td></tr>`).join('')}<tr><td colspan="3"><b>Total USD</b></td><td class="n"><b>${fmt(T.rev)}</b></td></tr></table><p class="note">Valid for 14 days. Branch terms and conditions apply.</p>${last?`<div class="actions"><button class="btn" data-a="revise" ${rr?'disabled':''}>${rr?'Revision requested on version '+vs[vs.length-1].v:'Revise or negotiate'}</button></div>`:'<p class="note">This is an earlier version.</p>'}</div>
<div class="card"><h2>Email from GAC</h2><div class="mail">Subject: Quotation ${r.id.replace('REQ','QT')}, ${r.lane}\n\nDear Blue Dune Energy,\n\nThank you for your request. Please find our quotation for ${r.mode.toLowerCase()} freight, ${r.lane}. The total is USD ${fmt(T.rev)}.\n\nKind regards,\nChristine Zock\nGAC</div></div></div>`}
function gacView(){if(S.gv==='requests')return reqList();if(S.gv==='draft')return draft();if(S.gv==='approvals')return approvals();if(S.gv==='email')return email();if(S.gv==='settings')return settings()}
function reqList(){const F=['All','Missing information','Draft ready','Submitted','Accepted','Sent'];const L=S.reqs.filter(r=>S.filter==='All'||(S.filter==='Sent'?r.st==='Sent to customer':r.st===S.filter));
return `<h1>Requests</h1><p class="sub">Every request from both doors, newest first.</p><div class="pills">${F.map(f=>`<button data-a="filter" data-v="${f}" class="${S.filter===f?'act':''}">${f}</button>`).join('')}</div><div class="card tw"><table><tr><th>Received</th><th>Source</th><th>Customer</th><th>Mode</th><th>Lane</th><th>Status</th><th>Missing information</th><th>Action</th></tr>${L.map(r=>{const a=r.st==='Missing information'?['Add Information','addinfo']:['Sent to customer','Accepted'].includes(r.st)?['View','edit']:['Edit Draft','edit'];return `<tr><td>${r.date}</td><td><span class="chip c-${r.src==='Portal'?'info':'grey'}">${r.src}</span></td><td>${r.cust}</td><td>${r.mode}</td><td>${r.lane}</td><td>${chipFor(r.st)}</td><td class="small">${(r.missing||[]).join(', ')||'-'}</td><td><button class="btn sm ${a[0]==='View'?'ghost':''}" data-a="${a[1]}" data-v="${r.id}">${a[0]}</button></td></tr>`}).join('')||'<tr><td colspan="8" class="small">No requests here.</td></tr>'}</table></div>`}
function draft(){const r=get(S.draft);const T=tot(r.lines,r);const need=r.lines.some(l=>l.price===null);const w=wt(r.mode,r.kg,r.cbm);const ro=['Sent to customer'].includes(r.st);const open=(r.notes||[]).filter(n=>n.st==='open');
return `<div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-start"><div><h1>${r.id.replace('REQ','QT')} ${chipFor(r.st)}</h1><p class="sub">${r.cust}, ${r.mode}, ${r.lane}. Source <span class="chip c-${r.src==='Portal'?'info':'grey'}">${r.src}</span></p></div><button class="btn ghost" data-a="gv" data-v="requests">Back to Requests</button></div>
${r.rev?`<div class="banner"><b>Customer revision request</b> (on version ${r.rev.v})<br>${r.rev.msg?'“'+r.rev.msg+'”':'No message.'}<br><span class="small">Target prices appear beside the lines. They are information only.</span></div>`:''}
${open.length?`<div class="card"><h2>Notes: suggestions from earlier notes</h2>${open.map(n=>{const l=r.lines.find(x=>x.s===n.svc);const warn=l&&l.unit===n.basis&&n.price>3*l.price;const okb=l&&l.unit===n.basis;return okb?`<div class="sug ${warn?'warn':''}"><div><b>Change ${n.svc} to ${fmt(n.price)} ${n.basis}</b> (now ${fmt(l.price)} ${l.unit})<div class="small">Reason: ${n.reason}. Source: Note from ${n.from}. Basis: ${n.basis}.</div>${warn?'<div style="color:var(--warn);font-weight:600">Warning: more than 3 times the current price.</div>':''}</div><div><button class="btn sm" data-a="acc" data-v="${n.id}" ${ro?'disabled':''}>Accept</button> <button class="btn sm ghost" data-a="dis" data-v="${n.id}">Dismiss</button></div></div>`:''}).join('')}<p class="note">A suggestion changes nothing until you press Accept. Notes are internal and never shown to the customer.</p></div>`:''}
<div class="card"><h2>Cargo</h2><div class="row"><div><label>Gross weight</label><b>${fmt(r.kg)} kg</b></div><div><label>Volume</label><b>${r.cbm} m3</b></div><div><label>Chargeable weight</label><b>${fmt(r.kg)} kg</b></div><div><label>Incoterm</label><b>${r.inc||'-'}</b></div></div><div class="note">${r.mode==='Air'?`Volume weight = ${r.cbm} x 1000 / 6 = ${fmt(r.cbm*1000/6)} kg. Chargeable is the greater of actual and volume weight.`:'Weight rule not defined for this mode. Gross weight shown.'}</div></div>
<div class="card tw"><h2>Cost lines</h2><table><tr><th>Service</th><th>Unit</th><th class="n">Unit price</th><th class="n">Bill amount</th><th class="n">Est. cost</th><th class="n">Est. Op. Income</th><th>Source</th>${r.rev?'<th class="n">Customer target</th>':''}<th></th></tr>${r.lines.map((l,i)=>{const a=amt(l,r);return `<tr><td>${l.s}</td><td>${l.unit}</td><td class="n"><input data-line="${i}" type="number" step="0.01" value="${l.price===null?'':l.price}" style="width:100px;text-align:right" aria-label="Unit price ${l.s}" ${ro?'disabled':''}></td><td class="n">${a===null?'-':fmt(a)}</td><td class="n">${fmt(cst(l,r))}</td><td class="n">${a===null?'-':fmt(a-cst(l,r))}</td><td>${l.price===null?'<span class="chip c-bad">Rate needed</span>':`<span class="chip c-${l.src==='Template'?'good':l.src==='Manual'?'grey':'info'}">${l.src}</span>`}</td>${r.rev?`<td class="n">${r.rev.t[l.s]?fmt(+r.rev.t[l.s]):'-'}</td>`:''}<td>${ro?'':`<button class="btn sm ghost" data-a="rm" data-v="${i}">Remove</button>`}</td></tr>`}).join('')}</table><div class="actions" style="justify-content:flex-start">${ro?'':'<button class="btn sm ghost" data-a="addsvc">Add service</button> <button class="btn sm ghost" data-a="addnote">Add note</button>'}</div>
${S.why?`<div class="sug" style="margin-top:12px"><b>Why this change?</b><span>${['Customer agreed new rate','This lane needs it','Wrong service','Other'].map(w=>`<button class="btn sm ghost" data-a="why" data-v="${w}">${w}</button>`).join(' ')}</span></div>`:''}
<div class="sum"><div><span class="small">Revenue (USD)</span><b>${fmt(T.rev)}</b></div><div><span class="small">Est. Cost (USD)</span><b>${fmt(T.c)}</b></div><div><span class="small">Est. Op. Income (USD)</span><b>${fmt(T.oi)}</b></div><div><span class="small">Margin</span><b>${fmt(T.m)}%</b></div></div></div>
<div class="actions">${need?'<span class="small">Submit is blocked while a line says Rate needed.</span>':''}${['Draft ready','Rejected','Revision requested'].includes(r.st)?`<button class="btn" data-a="submit" ${need?'disabled':''}>Submit</button>`:r.st==='Submitted'?'<span class="small">Submitted. Open Approvals to accept.</span>':''}</div>
<div class="card"><h2>Timeline</h2><ul class="tl">${r.tl.map(x=>`<li>${x}</li>`).join('')}</ul></div>`}
function approvals(){const T=['Waiting','Accepted','Rejected','Sent'];const map={Waiting:['Submitted'],Accepted:['Accepted'],Rejected:['Rejected'],Sent:['Sent to customer']};const L=S.reqs.filter(r=>map[S.apTab].includes(r.st));
return `<h1>Approvals</h1><p class="sub">Accept, reject and send quotations created through the new flow.</p><div class="tabs">${T.map(t=>`<button data-a="aptab" data-v="${t}" class="${S.apTab===t?'act':''}">${t}</button>`).join('')}</div><div class="card tw"><table><tr><th>Quotation</th><th>Customer</th><th>Lane</th><th class="n">Revenue (USD)</th><th>Action</th></tr>${L.map(r=>`<tr><td class="mono">${r.id.replace('REQ','QT')}${r.versions.length?' v'+(r.versions.length+1):''}</td><td>${r.cust}</td><td>${r.lane}</td><td class="n">${fmt(tot(r.lines,r).rev)}</td><td>${r.st==='Submitted'?`<button class="btn sm" data-a="accept" data-v="${r.id}">Accept</button> <button class="btn sm red" data-a="reject" data-v="${r.id}">Reject</button>`:r.st==='Accepted'?`<button class="btn sm" data-a="sendprev" data-v="${r.id}">Send to customer</button> <button class="btn sm ghost" data-a="job">Open in job portal</button>`:'<span class="small">Done</span>'}</td></tr>`).join('')||'<tr><td colspan="5" class="small">Nothing here.</td></tr>'}</table></div>`}
function email(){const k=S.sample,s=SAMPLES[k];const m=S.mail||s;return `<h1>Email simulator</h1><p class="sub">Pretend to be the customer. The AI reads the email and creates a request.</p><div class="split"><div class="card"><label for="smp">Load sample email</label><select id="smp">${Object.keys(SAMPLES).map(x=>`<option ${x===k?'selected':''}>${x}</option>`).join('')}</select><div class="row" style="margin-top:12px"><div><label>From</label><input id="m_from" value="${m.from}"></div><div><label>To</label><input value="quotes@gac.com"></div></div><div style="margin-top:12px"><label>Subject</label><input id="m_subj" value="${m.subj}"></div><div style="margin-top:12px"><label for="m_body">Body</label><textarea id="m_body" rows="12">${m.body}</textarea></div><div class="actions"><button class="btn" data-a="sendmail">Send email</button></div></div><div class="card"><h2>Latest from email</h2>${S.reqs.filter(r=>r.src==='Email').slice(0,4).map(r=>`<p style="margin:0 0 10px"><span class="mono">${r.id}</span> ${r.cust}<br>${chipFor(r.st)}</p>`).join('')}</div></div>`}
function settings(){return `<h1>Settings</h1><p class="sub">Choose which AI reads the emails. No restart needed.</p><div class="card" style="max-width:560px"><h2>AI provider</h2><label for="prov">Provider</label><select id="prov"><option>Ollama (local)</option><option>Gemini</option><option>Claude</option><option>OpenAI</option></select><div style="margin-top:12px"><label for="mdl">Model</label><input id="mdl" value="llama3.3"></div><p class="note">Key found in environment: yes. The key itself is never shown.</p><div class="actions" style="justify-content:flex-start"><button class="btn" data-a="test">Save and test connection</button></div><div id="tres" class="small" style="margin-top:8px">${S.tres||''}</div></div>`}
function modal(){const m=S.modal;if(m.t==='revise'){const r=get(S.open);const v=r.versions[r.versions.length-1];return `<div class="modalbg"><div class="modal"><h2>Revise or negotiate</h2><label for="rv_msg">What would you like to change?</label><textarea id="rv_msg" rows="3"></textarea><h2 style="margin-top:16px">Target prices (optional)</h2><table>${v.lines.map((l,i)=>`<tr><td>${l.s}</td><td class="n small">${fmt(amt(l,r))} quoted</td><td style="width:130px"><input class="tp" data-s="${l.s}" type="number" step="0.01" placeholder="Target" aria-label="Target ${l.s}"></td></tr>`).join('')}</table><p class="note">Add a message or at least one target price.</p><div class="actions"><button class="btn ghost" data-a="close">Cancel</button><button class="btn" data-a="sendrev">Send to GAC</button></div></div></div>`}
if(m.t==='send'){const r=get(m.id);const T=tot(r.lines,r);const n=r.versions.length+1;return `<div class="modalbg"><div class="modal"><h2>Send to customer</h2><p class="small">${n>1?'Revised quotation, version '+n:'First quotation, version 1'}</p><label>To</label><input value="${r.cust.toLowerCase().replace(/ /g,'.')}@customer.demo" readonly><label style="margin-top:10px">Subject</label><input value="Quotation ${r.id.replace('REQ','QT')}, ${r.lane}" readonly><div class="mail" style="margin:12px 0">Dear ${r.cust},\n\nThank you for your request. Please find our ${n>1?'revised ':''}quotation for ${r.mode.toLowerCase()} freight, ${r.lane}. The total is USD ${fmt(T.rev)}.\n\nKind regards,\nChristine Zock</div><table><tr><th>Service</th><th class="n">Amount (USD)</th></tr>${r.lines.map(l=>`<tr><td>${l.s}</td><td class="n">${fmt(amt(l,r))}</td></tr>`).join('')}</table><p class="note">The customer never sees cost, margin or income.</p><div class="actions"><button class="btn ghost" data-a="close">Cancel</button><button class="btn" data-a="send" data-v="${r.id}">Send</button></div></div></div>`}
if(m.t==='addinfo'){const r=get(m.id);return `<div class="modalbg"><div class="modal"><h2>Add Information</h2><p>This request is missing: <b>${r.missing.join(', ')}</b></p><label for="ai_t">Your answer in plain words</label><textarea id="ai_t" rows="3" placeholder="For example: FOB, total weight 320 kg, volume 1.8 cbm"></textarea>${m.res?`<p class="small" style="margin-top:10px">${m.res}</p>`:''}<div class="actions"><button class="btn ghost" data-a="close">Cancel</button><button class="btn" data-a="aiupd" data-v="${r.id}">Update request</button></div></div></div>`}
if(m.t==='reject')return `<div class="modalbg"><div class="modal"><h2>Reject quotation</h2><label for="rj">Reason</label><textarea id="rj" rows="3"></textarea><div class="actions"><button class="btn ghost" data-a="close">Cancel</button><button class="btn red" data-a="doreject" data-v="${m.id}">Reject</button></div></div></div>`}
function toast(t){S.toast=t;draw();setTimeout(()=>{S.toast='';draw()},2200)}
function draw(){const ae=document.activeElement;const id=ae&&ae.id;const pos=ae&&ae.selectionStart;document.getElementById('app').innerHTML=H();if(id){const e=document.getElementById(id);if(e){e.focus();try{e.setSelectionRange(pos,pos)}catch(_){}}}}
const D={
menu(){S.menu=!S.menu},user(v){S.user=v;S.menu=false;S.modal=null;if(v==='gac'&&S.gv==='draft'&&!S.draft)S.gv='requests'},rail(){S.rail=!S.rail},cv(v){S.cv=v;S.menu=false;S.ver=null;if(v==='form'||v==='new'){S.tried=false}},gv(v){S.gv=v;S.why=null},
mode(v){S.mode=v;S.f={}},example(){const ex={from:'Shanghai (SHA)',to:'Dubai (DXB)',qty:'3',kg:'450',cbm:'3.2',inc:'DAP',desc:'Pump spare parts',ready:'2026-11-16',load:'LCL',veh:'FTL'};S.f={...S.f,...ex}},
submitreq(){if(missingF().length){S.tried=true;return}const f=S.f;const id='REQ-000'+(++seq+1);const r={id,src:'Portal',cust:'Blue Dune Energy',mode:S.mode,lane:`${f.from||'Origin'} to ${f.to||'Destination'}`,st:'Draft ready',kg:+f.kg||0,cbm:+f.cbm||0,inc:f.inc,lines:mkLines(),notes:mkNotes(),versions:[],tl:['Received just now','Draft created in the background'],date:'6 Nov'};if(S.mode!=='Air')r.lines=r.lines.map(l=>({...l}));S.reqs.unshift(r);S.done={id,mode:S.mode,lane:r.lane,kg:r.kg,cbm:r.cbm,inc:f.inc};S.cv='done'},
cq(v){S.open=v;S.cv='quote';S.ver=null},revise(){S.modal={t:'revise'}},close(){S.modal=null},
sendrev(){const msg=document.getElementById('rv_msg').value.trim();const t={};document.querySelectorAll('.tp').forEach(e=>{if(e.value)t[e.dataset.s]=e.value});if(!msg&&!Object.keys(t).length){toast('Add a message or one target price');return}const r=get(S.open);r.st='Revision requested';r.rev={msg,t,v:r.versions.length};r.tl.push('Customer requested a revision of version '+r.versions.length);S.modal=null;toast('Sent to GAC')},
filter(v){S.filter=v},edit(v){S.draft=v;S.gv='draft'},addinfo(v){S.modal={t:'addinfo',id:v}},
aiupd(v){const t=document.getElementById('ai_t').value.trim();const r=get(v);if(!t){S.modal.res='Please type an answer.';return}if(t.length<8){S.modal.res='Still missing: '+r.missing.join(', ')+'. Could you add more detail?';return}r.missing=[];r.st='Draft ready';r.kg=320;r.cbm=1.8;r.inc='FOB';r.lines=mkLines();r.notes=[];r.tl.push('Information added, draft created');S.modal=null;S.draft=v;S.gv='draft'},
acc(v){const r=get(S.draft);const n=r.notes.find(x=>x.id==+v);const l=r.lines.find(x=>x.s===n.svc);l.price=n.price;l.src='Accepted from note';n.st='accepted';toast('Applied from note')},dis(v){const r=get(S.draft);r.notes.find(x=>x.id==+v).st='dismissed'},
rm(v){const r=get(S.draft);r.lines.splice(+v,1);S.why=true},addsvc(){const r=get(S.draft);r.lines.push({s:'Storage',unit:'per shipment',price:null,cost:40,src:'Manual'});S.why=true},addnote(){toast('Free text note saved on this quotation')},why(v){S.why=null;toast('Note saved: '+v)},
submit(){const r=get(S.draft);r.st='Submitted';r.tl.push('Submitted');S.gv='approvals';S.apTab='Waiting'},aptab(v){S.apTab=v},accept(v){const r=get(v);r.st='Accepted';r.tl.push('Accepted');S.apTab='Accepted'},reject(v){S.modal={t:'reject',id:v}},doreject(v){const r=get(v);r.st='Rejected';r.tl.push('Rejected: '+(document.getElementById('rj').value||'no reason'));S.modal=null;S.apTab='Rejected'},
sendprev(v){S.modal={t:'send',id:v}},send(v){const r=get(v);r.versions.push({v:r.versions.length+1,lines:clone(r.lines)});r.st='Sent to customer';r.rev=null;r.tl.push('Sent to customer, version '+r.versions.length);S.modal=null;S.apTab='Sent';toast('Sent. The customer now sees Quotation ready.')},job(){toast('Hand over placeholder. Quote to Job already exists in Marlog.')},
sendmail(){const k=S.sample,s=SAMPLES[k];const m=s;const id='REQ-000'+(++seq+1);const r={id,src:'Email',cust:s.cust,mode:s.mode,lane:s.lane,st:s.missing?'Missing information':'Draft ready',missing:s.missing||[],kg:s.mode==='Air'&&s.kg?Math.max(s.kg,s.cbm*1000/6):s.kg||0,cbm:s.cbm||0,inc:s.inc,lines:s.missing?[]:mkLines(),notes:s.cust==='Demo Principal 07'?mkNotes():[],versions:[],tl:['Received just now','Read by AI'],date:'6 Nov'};if(s.mode==='Sea'&&!s.missing){r.lines=r.lines.map(l=>({...l,price:null,src:'Template'}));r.lines.forEach(l=>l.price=null)}S.reqs.unshift(r);S.gv='requests';S.filter='All';toast(s.missing?'Request created: Missing information':'Request created: Draft ready')},test(){S.tres='Connected. Model answered in 1.4 s.'}};
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b){if(S.menu&&!e.target.closest('.sw')){S.menu=false;draw()}return}const a=b.dataset.a;if(D[a]){D[a](b.dataset.v);draw()}});
document.addEventListener('input',e=>{const t=e.target;if(t.dataset.f){S.f[t.dataset.f]=t.value;if(t.tagName==='INPUT')draw();else draw()}});
document.addEventListener('change',e=>{const t=e.target;if(t.dataset.line!==undefined){const r=get(S.draft);const l=r.lines[+t.dataset.line];l.price=t.value===''?null:+t.value;if(l.price!==null)l.src=l.src==='Template'?'Manual':l.src;S.why=true;draw()}if(t.id==='ver'){S.ver=+t.value;draw()}if(t.id==='smp'){S.sample=t.value;S.mail=null;draw()}});
draw();
</script>
